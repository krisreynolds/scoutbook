{% extends "base.html" %}

{% block site_nav %}
  {{ super() }}
  <div id="md-nav-extra" style="display:none; flex-direction:column; gap:0.5rem; padding:0.75rem 1rem;">
    <a href="https://form.jotform.com/260734372907057" class="md-nav-btn md-nav-btn--green">
      ➕ Suggest a link
    </a>
    <a href="https://ko-fi.com/Q5Q61W68K8" target="_blank" rel="noopener" class="md-nav-btn md-nav-btn--yellow">
      🍺 Buy me a beer
    </a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var extra = document.getElementById("md-nav-extra");
      
      // 1. Target the Desktop Sidebar
      var desktopSidebar = document.querySelector(".md-sidebar--primary .md-sidebar__inner");
      // 2. Target the Mobile Drawer (Hamburger Menu)
      var mobileDrawer = document.querySelector(".md-nav--primary > .md-nav__list");

      if (extra) {
        // Clone the buttons so they can exist in two places at once
        if (desktopSidebar) {
          var desktopClone = extra.cloneNode(true);
          desktopClone.style.display = "flex";
          desktopSidebar.appendChild(desktopClone);
        }

        if (mobileDrawer) {
          var mobileClone = extra.cloneNode(true);
          mobileClone.style.display = "flex";
          // We wrap it in a list item to maintain Material's structural integrity
          var li = document.createElement("li");
          li.classList.add("md-nav__item");
          li.style.marginTop = "1rem";
          li.appendChild(mobileClone);
          mobileDrawer.appendChild(li);
        }
        
        // Remove the original hidden template
        extra.remove();
      }
    });
  </script>
  
  <script>
    kofiWidgetOverlay.draw('krisreynoldsdev', { ... });
  </script>
{% endblock %}

{% block extrahead %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="Scoutbook">
  <meta property="og:description" content="A curated list of tools, programme ideas, campsites and more for Scout volunteers.">
  <meta property="og:url" content="https://www.scoutbook.org.uk">
  <meta property="og:image" content="https://www.scoutbook.org.uk/assets/og-preview-v1.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
{% endblock %}
