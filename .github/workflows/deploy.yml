name: Deploy MkDocs
on:
  push:
    branches:
      - main

# Set the environment variable globally for this workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6 # changed from v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Being specific prevents unexpected breaks

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-open-in-new-tab

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --config-file mkdocs.yml