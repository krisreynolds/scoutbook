site_name: Scoutbook
site_description: A curated list of tools, programme ideas, campsites and more for Scout volunteers.
site_url: https://www.scoutbook.org.uk

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png   
  custom_dir: overrides
  font:
    text: Nunito Sans
    code: DM Mono
  palette:
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 2
  - attr_list

plugins:
  - search
  - open-in-new-tab:
      add_icon: true

nav:
  - Home: index.md
  - Campsites: campsites.md
  - External Activity Providers: external-providers.md
  - Gang Shows: gangshows.md
  - Jamborees: jamborees.md
  - Programme Ideas: programme-ideas.md
  - Scout Association Links: scouts-links.md
  - Scout Discounts: discounts.md 
  - Scouting Facebook Groups: facebookgroups.md  
  - Shops & Suppliers: shops-suppliers.md
  - Tools & Apps: tools.md
  - Useful Links: otherlinks.md
  
extra_css:
  - extra.css

extra:
  analytics:
    provider: google
    property: G-JWNP8ZVZ0P
  consent:
      title: Cookie consent
      description: >-
        We use cookies (unfortunately not the kind with chocolate chips!) to anonymously track the usage of this website.
      actions:
        - accept
        - manage
